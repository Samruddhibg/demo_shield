services:
  - type: web
    name: demo_shield
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://demo-shield.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: guardin_shield_postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: guardin_shield_redis
          type: redis
          property: connectionString

databases:
  - name: guardin_shield_postgres
    plan: free
    databaseName: guardin_shield_postgres
    user: guardin_shield_postgres_user

redis:
  - name: guardin_shield_redis
    plan: free
    maxmemoryPolicy: allkeys-lru
