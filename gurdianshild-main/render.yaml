services:
  - type: web
    name: guardianshield
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://guardianshield.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: guardianshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: guardianshield-redis
          type: redis
          property: connectionString

databases:
  - name: guardianshield-db
    plan: free
    databaseName: guardianshield
    user: guardianshield

redis:
  - name: guardianshield-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
