name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            **/package-lock.json

      - name: Install backend dependencies
        working-directory: gurdianshild-main/backend
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        working-directory: gurdianshild-main/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guardianshield
          S3_BUCKET_NAME: guardianshield-test
          S3_PREFIX: guardianshield/users
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: npm test

      - name: Install frontend dependencies
        working-directory: gurdianshild-main/frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: gurdianshild-main/frontend
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS "$RENDER_DEPLOY_HOOK_URL"
